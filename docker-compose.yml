services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: mysql:8.0
    container_name: db
    command: --event-scheduler=ON
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: COMPONENT_DB
      MYSQL_USER: app_user
      MYSQL_PASSWORD: changeme_password
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysql -uapp_user -pchangeme_password -e 'SELECT 1' COMPONENT_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: backend
    image: <YOUR_AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/sre-dashboard:backend-latest
    ports:
      - "8080:8080"
    environment:
      DEBUG: "false"
    volumes:
      - ./backend/config/config.yaml:/app/config/config.yaml
      - ./backend/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  aggregator:
    build:
      context: ./aggregator
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: aggregator
    image: <YOUR_AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/sre-dashboard:aggregator-latest
    ports:
      - "8000:8000"
    environment:
      DEBUG: "false"
    volumes:
      - ./aggregator/config/config.yaml:/app/config/config.yaml
      - ./aggregator/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: frontend
    image: <YOUR_AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/sre-dashboard:frontend-latest
    volumes:
      - ./frontend/config/config.json:/usr/share/nginx/html/config.json
    depends_on:
      aggregator:
        condition: service_started
      backend:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl/sre-dashboard.crt:/etc/ssl/certs/sre-dashboard.crt
      - ./nginx/ssl/sre-dashboard.key:/etc/ssl/private/sre-dashboard.key
    depends_on:
      aggregator:
        condition: service_started
      backend:
        condition: service_started

volumes:
  redis_data:
  db_data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.10.0.0/27
