services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: mysql:8.0
    container_name: db
    command: --event-scheduler=ON
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: COMPONENT_DB
      MYSQL_USER: app_user
      MYSQL_PASSWORD: changeme_password
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysql -uapp_user -pchangeme_password -e 'SELECT 1' COMPONENT_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: backend:dev
    container_name: backend_dev
    ports:
      - "8080:8080"
    environment:
      DEBUG: "true"
      AWS_PROFILE: "PROD"
      AWS_CONFIG_FILE: "/root/.aws/config"
      SKIP_STARTUP_CACHE_TASKS: "true"
    volumes:
      - ./backend:/app
      - ${USERPROFILE}/.aws:/root/.aws:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  aggregator:
    build: 
      context: ./aggregator
      dockerfile: Dockerfile.dev
    image: aggregator:dev
    container_name: aggregator_dev
    ports:
      - "8000:8000"
    environment:
      DEBUG: "true"
      AWS_PROFILE: "PROD"
      AWS_CONFIG_FILE: "/root/.aws/config"
    volumes:
      - ./aggregator:/app
      - ${USERPROFILE}/.aws:/root/.aws:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: frontend:dev
    container_name: frontend_dev
    ports:
      - "3000:3000"
    volumes:
      - /app/node_modules
      - ./frontend:/app
    depends_on:
      aggregator:
        condition: service_started
      backend:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl/sre-dashboard.crt:/etc/ssl/certs/sre-dashboard.crt
      - ./nginx/ssl/sre-dashboard.key:/etc/ssl/private/sre-dashboard.key
    depends_on:
      aggregator:
        condition: service_started
      backend:
        condition: service_started

volumes:
  redis_data:
  db_data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.10.0.0/27
