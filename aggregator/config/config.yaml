aws_secrets_manager:
  enabled: true
  region_name: "eu-west-1"
  secret_name: "sre-dashboard/aggregator/config"

db_config:
  host: "db"
  database: "COMPONENT_DB"
  port: 3306

redis_config:
  host: "redis"
  port: 6379
  db: 0

component_tree:
  ttl_seconds: 60 # expire each connection snapshot after 60s
