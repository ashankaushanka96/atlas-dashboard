name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (demo mode, no backend)
        working-directory: frontend
        env:
          VITE_DEMO_MODE: "true"
          GH_PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Use demo runtime config
        working-directory: frontend
        run: cp public/config.demo.json dist/config.json

      - name: SPA fallback for client-side routing
        working-directory: frontend
        run: cp dist/index.html dist/404.html

      - name: Add architecture page
        run: cp docs/architecture.html frontend/dist/architecture.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
