server {
  listen 3000 default_server;

  root /usr/share/nginx/html;
  index index.html;

  # Vite's JS/CSS chunk filenames are content-hashed (e.g. main-abc123.js),
  # so once built they never change contents under the same name - safe to
  # cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html (and any other unhashed file) must always be revalidated,
  # otherwise browsers keep serving a stale index.html that points at an
  # old JS bundle hash after every deploy, appearing as "still on the old UI".
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}