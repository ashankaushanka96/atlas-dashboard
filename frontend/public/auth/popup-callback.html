<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microsoft Sign-In</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }

      .card {
        padding: 24px 28px;
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.2);
        box-shadow: 0 18px 48px rgba(2, 6, 23, 0.4);
        text-align: center;
        max-width: 360px;
      }

      .title {
        font-size: 20px;
        font-weight: 700;
        margin: 0 0 8px;
      }

      .text {
        font-size: 14px;
        line-height: 1.5;
        color: #cbd5e1;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="title">Microsoft sign-in complete</p>
      <p class="text">You can close this window if it does not close automatically.</p>
    </div>
  </body>
</html>
